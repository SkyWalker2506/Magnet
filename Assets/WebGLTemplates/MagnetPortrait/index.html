<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #111; overflow: hidden; }
      #unity-container.unity-desktop,
      #unity-container.unity-mobile {
        position: fixed !important;
        inset: 0 !important;
        left: 0 !important;
        top: 0 !important;
        transform: none !important;
        width: 100% !important;
        height: 100% !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        background: #111;
      }
      #unity-canvas {
        height: min(100vh, calc(100vw * 16 / 9)) !important;
        width: min(calc(100vh * 9 / 16), 100vw) !important;
        display: block;
        background: #231F20;
      }
      #unity-footer { display: none !important; }
      #unity-loading-bar { z-index: 10; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
      #unity-warning { position: absolute; left: 50%; top: 5%; transform: translate(-50%); background: white; padding: 10px; display: none; z-index: 11; }
    </style>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width={{{ WIDTH }}} height={{{ HEIGHT }}} tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">{{{ PRODUCT_NAME }}}</div>
      </div>
    </div>
    <script>
      var MAGNET_BUILD_VERSION = "{{{ PRODUCT_VERSION }}}";
      function deleteDb(name) {
        return new Promise(function (resolve) {
          try {
            var req = indexedDB.deleteDatabase(name);
            req.onsuccess = req.onerror = req.onblocked = function () { resolve(); };
          } catch (e) { resolve(); }
        });
      }
      async function resetIfNewBuild() {
        try {
          if (localStorage.getItem("magnet_build_version") === MAGNET_BUILD_VERSION) return;
          Object.keys(localStorage)
            .filter(function (k) {
              return k !== "magnet_build_version" && (
                k.indexOf("{{{ PRODUCT_NAME }}}") !== -1
                || k.indexOf("{{{ COMPANY_NAME }}}") !== -1
                || k.indexOf("unity") === 0);
            })
            .forEach(function (k) { localStorage.removeItem(k); });
          var names = ["/idbfs", "UnityCache"];
          if (window.indexedDB && indexedDB.databases) {
            try {
              var dbs = await indexedDB.databases();
              dbs.forEach(function (d) { if (d.name && names.indexOf(d.name) === -1) names.push(d.name); });
            } catch (e) {}
          }
          await Promise.all(names.map(deleteDb));
          localStorage.setItem("magnet_build_version", MAGNET_BUILD_VERSION);
        } catch (e) { console.warn("save reset skipped:", e); }
      }

      var canvas = document.querySelector("#unity-canvas");

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "{{{ COMPANY_NAME }}}",
        productName: "{{{ PRODUCT_NAME }}}",
        productVersion: "{{{ PRODUCT_VERSION }}}",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      resetIfNewBuild().then(function () {
        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = function () {
          createUnityInstance(canvas, config, function (progress) {
            document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
          }).then(function (unityInstance) {
            document.querySelector("#unity-loading-bar").style.display = "none";
            document.querySelector("#unity-fullscreen-button").onclick = function () {
              unityInstance.SetFullscreen(1);
            };
          }).catch(function (message) { console.error(message); });
        };
        document.body.appendChild(script);
      });
    </script>
  </body>
</html>
