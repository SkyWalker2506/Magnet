<!DOCTYPE html>
<html lang="en-us">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
        <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
        <title>{{{ PRODUCT_NAME }}}</title>
        <link rel="preconnect" href="https://bridge.playgama.com">
        <link rel="preload" href="Build/{{{ CODE_FILENAME }}}" as="fetch" type="application/wasm" crossorigin>
        <link rel="preload" href="Build/{{{ DATA_FILENAME }}}" as="fetch" crossorigin>
        <link rel="preload" href="Build/{{{ FRAMEWORK_FILENAME }}}" as="script">
        <style>
            html, body {
                width: 100%;
                height: 100%;
                padding: 0;
                margin: 0;
                overflow: hidden;
            }
            body {
                display: flex;
                align-items: center;
                justify-content: center;
                background:
                    radial-gradient(ellipse 80% 60% at 20% 30%, rgba(70, 130, 220, 0.55) 0%, transparent 60%),
                    radial-gradient(ellipse 70% 50% at 80% 70%, rgba(180, 80, 200, 0.50) 0%, transparent 60%),
                    radial-gradient(ellipse 60% 50% at 90% 20%, rgba(255, 140, 100, 0.30) 0%, transparent 55%),
                    radial-gradient(ellipse 60% 50% at 10% 85%, rgba(60, 200, 200, 0.30) 0%, transparent 55%),
                    linear-gradient(135deg, #1a1858 0%, #2a1d6b 35%, #3a2080 60%, #1d1450 100%);
            }
            body::before {
                content: "";
                position: fixed;
                inset: 0;
                pointer-events: none;
                background-image:
                    radial-gradient(1.5px 1.5px at 20% 30%, rgba(255, 255, 255, 0.9) 50%, transparent 100%),
                    radial-gradient(1px 1px at 70% 80%, rgba(255, 255, 255, 0.8) 50%, transparent 100%),
                    radial-gradient(1.5px 1.5px at 40% 60%, rgba(255, 255, 255, 0.85) 50%, transparent 100%),
                    radial-gradient(1px 1px at 85% 25%, rgba(255, 255, 255, 0.9) 50%, transparent 100%),
                    radial-gradient(2px 2px at 15% 75%, rgba(180, 200, 255, 0.85) 50%, transparent 100%),
                    radial-gradient(1px 1px at 60% 15%, rgba(255, 255, 255, 0.8) 50%, transparent 100%),
                    radial-gradient(1.5px 1.5px at 90% 65%, rgba(255, 220, 180, 0.75) 50%, transparent 100%),
                    radial-gradient(1px 1px at 30% 90%, rgba(255, 255, 255, 0.85) 50%, transparent 100%),
                    radial-gradient(1.5px 1.5px at 50% 50%, rgba(255, 255, 255, 0.7) 50%, transparent 100%),
                    radial-gradient(1px 1px at 80% 45%, rgba(200, 220, 255, 0.85) 50%, transparent 100%);
                background-repeat: repeat;
                background-size: 350px 350px;
                opacity: 0.95;
            }
            #canvas {
                background: #231F20;
                display: block;
                height: min(100vh, calc(100vw * 16 / 9));
                width: min(calc(100vh * 9 / 16), 100vw);
                box-shadow:
                    0 0 80px rgba(170, 130, 255, 0.55),
                    0 0 160px rgba(80, 50, 180, 0.35),
                    0 20px 60px rgba(0, 0, 0, 0.5);
                position: relative;
                z-index: 1;
                border-radius: 2px;
            }
        </style>
    </head>
    <body>
        <canvas id="canvas" tabindex="-1"></canvas>
        <script src="./playgama-bridge-unity.js"></script>
    </body>
</html>
