<!DOCTYPE html>
<html lang="en-us">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
        <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
        <title>{{{ PRODUCT_NAME }}}</title>
        <link rel="preconnect" href="https://bridge.playgama.com">
        <link rel="preload" href="Build/{{{ CODE_FILENAME }}}" as="fetch" type="application/wasm" crossorigin>
        <link rel="preload" href="Build/{{{ DATA_FILENAME }}}" as="fetch" crossorigin>
        <link rel="preload" href="Build/{{{ FRAMEWORK_FILENAME }}}" as="script">
        <style>
            html, body {
                width: 100%;
                height: 100%;
                padding: 0;
                margin: 0;
                background: #111;
                overflow: hidden;
            }
            body {
                display: flex;
                align-items: center;
                justify-content: center;
            }
            #canvas {
                background: #231F20;
                display: block;
                height: min(100vh, calc(100vw * 16 / 9));
                width: min(calc(100vh * 9 / 16), 100vw);
            }
        </style>
    </head>
    <body>
        <canvas id="canvas" tabindex="-1"></canvas>
        <script src="./playgama-bridge-unity.js"></script>
    </body>
</html>
